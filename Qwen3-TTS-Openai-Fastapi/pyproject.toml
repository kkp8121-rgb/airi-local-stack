[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.1.1"
description = "Qwen3-TTS with OpenAI-compatible FastAPI, voice cloning, and multiple inference backends"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team and contributors" }]

dependencies = [
  "numpy>=1.24",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "PyYAML>=6.0",
  "gradio",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart",
  "pydantic>=2.0.0",
  "inflect",
  "aiofiles",
  "pydub",
  "httpx>=0.24.0",
]
vllm = [
  "vllm>=0.4.0",
]
mlx = [
  # mlx-audio 0.3.x pins a Transformers 5 release candidate. Use this extra
  # in a dedicated Apple Silicon environment rather than mixing it with the
  # official/CPU backend environment that pins Transformers 4.57.3.
  "mlx-audio>=0.3.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.10'",
  "huggingface_hub[hf_xet]; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.10'",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/groxaxo/Qwen3-TTS-Openai-Fastapi"
Repository = "https://github.com/groxaxo/Qwen3-TTS-Openai-Fastapi"
Upstream = "https://github.com/QwenLM/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"
qwen-tts-api = "api.main:main"
qwen-tts-voice-studio = "gradio_voice_studio:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["qwen_tts*", "api*"] } }
py-modules = ["gradio_voice_studio"]
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
api = ["static/*", "static/**/*"]
