name: Regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pydantic pytest pytest-asyncio

      - name: Compile Python sources
        run: python -m compileall -q api tests/test_regressions.py

      - name: Run regression tests
        run: pytest -q tests/test_regressions.py
