name: Remediation checkpoint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run offline checkpoint contracts
        shell: pwsh
        run: .\test-current-checkpoint.ps1
