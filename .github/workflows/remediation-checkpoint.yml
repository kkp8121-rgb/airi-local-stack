name: Remediation checkpoint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Check committed whitespace
        shell: pwsh
        # The checkout is clean, so git diff --check would inspect nothing.
        # Patch artifacts intentionally preserve byte-level whitespace and are
        # covered by the manifest hash instead of this source diff check.
        run: git diff-tree --check --no-commit-id -r HEAD -- . ':(exclude)airi_docs/patches/*.patch'

      - name: Run offline checkpoint contracts
        shell: pwsh
        run: .\test-current-checkpoint.ps1
