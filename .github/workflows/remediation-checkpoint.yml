name: Remediation checkpoint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Check committed whitespace
        shell: pwsh
        # Inspect the complete push/PR range rather than only the final commit.
        # Patch artifacts intentionally preserve byte-level whitespace and are
        # covered by the manifest hash instead of this source diff check.
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BEFORE: ${{ github.event.before || '' }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || '' }}
          CHECK_HEAD: ${{ github.sha }}
        run: |
          function Assert-CommitSha([string] $Value, [string] $Name) {
            if ($Value -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Invalid $Name commit SHA."
            }
          }

          Assert-CommitSha $env:CHECK_HEAD 'head'
          $range = $null
          if ($env:CHECK_EVENT -eq 'push' -and $env:CHECK_BEFORE -and $env:CHECK_BEFORE -notmatch '^0+$') {
            Assert-CommitSha $env:CHECK_BEFORE 'before'
            $range = "$($env:CHECK_BEFORE)..$($env:CHECK_HEAD)"
          }
          elseif ($env:CHECK_EVENT -eq 'pull_request' -and $env:CHECK_BASE) {
            Assert-CommitSha $env:CHECK_BASE 'base'
            $range = "$($env:CHECK_BASE)...$($env:CHECK_HEAD)"
          }

          if ($range) {
            git diff --check $range -- . ':(exclude)airi_docs/patches/*.patch'
          }
          else {
            git diff-tree --check --no-commit-id -r $env:CHECK_HEAD -- . ':(exclude)airi_docs/patches/*.patch'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run offline checkpoint contracts
        shell: pwsh
        run: .\test-current-checkpoint.ps1
