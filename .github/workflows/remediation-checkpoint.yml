name: Remediation checkpoint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run offline checkpoint contracts
        shell: pwsh
        run: .\test-current-checkpoint.ps1
